# Install to /etc/nginx/sites-available/fileaway, then edit server_name.
# Enable with: ln -s /etc/nginx/sites-available/fileaway /etc/nginx/sites-enabled/fileaway
# Certbot (enable-https.sh) adds the TLS server block and HTTP redirect.

# Basic abuse protection for public uploads. A rate of 6/minute per IP with a
# burst of 3 still allows normal use while limiting disk-filling attempts.
# Downloads are not counted because their key is empty.
map $request_uri $fileaway_upload_key {
    default "";
    ~^/upload $binary_remote_addr;
}
limit_req_zone $fileaway_upload_key zone=fileaway_uploads:10m rate=6r/m;

# Share tokens are part of the request URI. Do not write them to access logs.
map $request_uri $fileaway_loggable {
    default 1;
    ~^/files/share/ 0;
}

server {
    server_tokens off;
    access_log /var/log/nginx/access.log combined if=$fileaway_loggable;
    listen 80;
    listen [::]:80;
    server_name your-subdomain.duckdns.org;

    # The app enforces exactly 100 MiB per uploaded file. This transport
    # limit is slightly higher to allow multipart/form-data overhead.
    client_max_body_size 101m;
    client_body_timeout 120s;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        limit_req zone=fileaway_uploads burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large uploads instead of buffering them in Nginx memory.
        proxy_request_buffering off;
        proxy_buffering off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
}
